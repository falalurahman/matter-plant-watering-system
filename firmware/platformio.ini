; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = main
build_dir = .pio/build

; Load gitignored WiFi credentials (used by [env:esp32] only)
; Create secrets.ini from secrets.ini.example before building for ESP32
extra_configs = secrets.ini

; ============================================================================
; Common Configuration (inherited by all environments)
; ============================================================================
[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino, espidf
board_build.partitions = partitions.csv
; Shared Matter device identity / setup-code library, pinned to a release tag.
; See https://github.com/falalurahman/matter-device-provider (AGENTS.md).
lib_deps =
    https://github.com/falalurahman/matter-device-provider.git#v1.0.0
board_build.embed_txtfiles =
    managed_components/espressif__esp_insights/server_certs/https_server.crt
    managed_components/espressif__esp_rainmaker/server_certs/rmaker_mqtt_server.crt
    managed_components/espressif__esp_rainmaker/server_certs/rmaker_claim_service_server.crt
    managed_components/espressif__esp_rainmaker/server_certs/rmaker_ota_server.crt
upload_speed = 921600
monitor_speed = 115200
monitor_filters = default, colorize
board_build.cmake_extra_args =
    -D SDKCONFIG_DEFAULTS="sdkconfig.defaults"
    -D CMAKE_C_COMPILER_LAUNCHER=ccache
    -D CMAKE_CXX_COMPILER_LAUNCHER=ccache
build_unflags =
    -std=c++17
    -std=gnu++2b
build_flags =
    -std=gnu++2a
    -Wno-missing-field-initializers
    -D CORE_DEBUG_LEVEL=2
    -D MATTER_DEVICE_PRODUCT_NAME=\"Matter\ Plant\ Waterer\"
    -D MATTER_DEVICE_PRODUCT_LABEL=\"Plant\ Waterer\"
    -D MATTER_DEVICE_SERIAL_NUMBER=\"PW-2625-001\"
    -D MATTER_DEVICE_SETUP_PASSCODE=26250001
    -D MATTER_DEVICE_SETUP_DISCRIMINATOR=1001
    ; 0 = active-HIGH (N-channel MOSFETs / active-high relay modules)
    ; 1 = active-LOW  (optocoupler relay boards where IN=LOW triggers coil)
    -D RELAY_ACTIVE_LOW=0

; ============================================================================
; ESP32 Configuration (Matter over WiFi, no BLE commissioning)
; ============================================================================
; Classic ESP32: WiFi-only Matter. BLE commissioning is not available on this
; SoC in the Arduino framework. WiFi credentials must be pre-provisioned via
; secrets.ini. Matter commissioning happens over-network via mDNS + QR code.
; ============================================================================
[env:esp32]
board = esp32dev
build_flags =
    ${env.build_flags}
    -D ARDUINO_USB_CDC_ON_BOOT=0
    ; WiFi credentials loaded from secrets.ini (gitignored — never commit)
    -D WIFI_SSID=\"${secrets.wifi_ssid}\"
    -D WIFI_PASSWORD=\"${secrets.wifi_password}\"
    ; GPIO pin assignments — avoid ESP32 strapping pins: 0, 2, 5, 12, 15
    -D VALVE_PIN_0=13  -D VALVE_PIN_1=14  -D VALVE_PIN_2=16  -D VALVE_PIN_3=17
    -D VALVE_PIN_4=18  -D VALVE_PIN_5=19  -D VALVE_PIN_6=21  -D VALVE_PIN_7=22
    -D VALVE_PIN_8=23  -D VALVE_PIN_9=25
    -D MOTOR_PIN=26
    -D STATUS_LED_PIN=2
    -D ACTION_BUTTON_PIN=0
upload_flags =
    --before=default_reset
    --after=hard_reset

; ============================================================================
; ESP32-C6 Configuration (Matter over WiFi + BLE commissioning)
; ============================================================================
; ESP32-C6: WiFi Matter with full BLE commissioning support. No hardcoded
; WiFi credentials needed — the Matter controller provisions WiFi via BLE.
; Supports: WiFi 802.11 b/g/n, BLE 5.0, Thread 802.15.4 (WiFi used here).
; ============================================================================
[env:esp32c6-devkitc-1]
board = esp32-c6-devkitc-1
build_flags =
    ${env.build_flags}
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    ; GPIO pin assignments for ESP32-C6 DevKitC-1
    -D VALVE_PIN_0=0   -D VALVE_PIN_1=1   -D VALVE_PIN_2=2   -D VALVE_PIN_3=3
    -D VALVE_PIN_4=4   -D VALVE_PIN_5=5   -D VALVE_PIN_6=6   -D VALVE_PIN_7=7
    -D VALVE_PIN_8=15  -D VALVE_PIN_9=16
    -D MOTOR_PIN=17
    -D STATUS_LED_PIN=8
    -D ACTION_BUTTON_PIN=9
upload_flags =
    --before=default_reset
    --after=hard_reset

; ============================================================================
; ESP32-H2 Configuration (Matter over Thread + BLE commissioning)
; ============================================================================
; ESP32-H2: Thread-only Matter (no WiFi radio). BLE commissioning is
; supported. Requires a Thread Border Router (HomePod Mini, Apple TV 4K,
; Google Nest Hub 2nd gen, etc.) on the same network.
; ============================================================================
[env:esp32h2-devkitm-1]
board = esp32-h2-devkitm-1
build_flags =
    ${env.build_flags}
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CONFIG_ENABLE_MATTER_OVER_THREAD=1
    ; GPIO pin assignments for ESP32-H2 DevKitM-1
    ; Available GPIOs: 0-12, 22-25 (GPIO 9 = BOOT button, used for action)
    -D VALVE_PIN_0=2   -D VALVE_PIN_1=3   -D VALVE_PIN_2=4   -D VALVE_PIN_3=5
    -D VALVE_PIN_4=6   -D VALVE_PIN_5=7   -D VALVE_PIN_6=10  -D VALVE_PIN_7=11
    -D VALVE_PIN_8=12  -D VALVE_PIN_9=22
    -D MOTOR_PIN=23
    -D STATUS_LED_PIN=25
    -D ACTION_BUTTON_PIN=9
upload_flags =
    --before=default_reset
    --after=hard_reset
